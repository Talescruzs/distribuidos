services:
  db:
    image: postgres:17
    container_name: sd_crud_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cruddb
      POSTGRES_USER: cruduser
      POSTGRES_PASSWORD: crudpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cruduser -d cruddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: sd_crud_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cruduser:crudpass@db:5432/cruddb
      FLASK_APP: app:create_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 60 "app:create_app()"

volumes:
  postgres_data:
